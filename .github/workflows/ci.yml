name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run unit tests
        env:
          # Live smoke tests are gated by RUN_LIVE=1; CI runs unit tests only.
          RUN_LIVE: "0"
        run: |
          pytest -ra --strict-markers \
            --ignore=tests/test_smoke_live.py

  image:
    name: Docker build + interpreter guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: mcp-youtube:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the image ships the Python minor version we target
        # Guard rail for the base-image bump trap. The job above runs on
        # actions/setup-python 3.13, so nothing here ever executed the *image's*
        # interpreter. That let a Dependabot base-image bump move the Dockerfile
        # FROM tag from 3.13 to 3.14 on sister repos and ship a runtime no
        # lockfile or check had exercised, with CI fully green throughout.
        #
        # pyproject requires >=3.13, ruff targets py313 and requirements.lock is
        # compiled with --python-version 3.13, so the image must agree.
        # --entrypoint is required: the image's ENTRYPOINT is the server itself.
        run: |
          docker run --rm --entrypoint python mcp-youtube:ci -c '
          import sys
          want = (3, 13)
          got = sys.version_info[:2]
          assert got == want, (
              f"image ships Python {sys.version.split()[0]}, but pyproject, ruff "
              f"and requirements.lock all target {want[0]}.{want[1]}. Fix the "
              f"Dockerfile FROM tag, or retarget every version surface together."
          )
          print(f"image Python {sys.version.split()[0]} matches target {want[0]}.{want[1]}")
          '
